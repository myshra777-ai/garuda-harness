[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "garuda-harness"
version = "0.1.0"
description = "Read-only execution and continuity harness for Garuda"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Rohit Mishra" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11"
]

[project.scripts]
garuda-harness = "harness.controller:main"

[tool.setuptools.packages.find]
include = ["harness*"]
exclude = ["tests*", "fixtures*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
